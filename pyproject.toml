[project]
name = "applied-data-coding-learning-lab"
version = "1.0.0"
description = "A public, browser-runnable learning lab for applied data coding"
requires-python = ">=3.12,<3.14"
dependencies = [
  "geopandas>=1.0,<2",
  "ipykernel>=6.29,<7",
  "jupyter-book==2.1.6",
  "jupyterlite-core==0.8.3",
  "jupyterlite-pyodide-kernel==0.8.5",
  "mapclassify>=2.8,<3",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "patsy>=1,<2",
  "pillow>=11,<13",
  "pytest>=8.3,<9",
  "statsmodels>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
