name: Validate and deploy learning lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - name: Verify deterministic synthetic data
        run: uv run python scripts/generate_teaching_data.py --check
      - name: Prevent private-material publication
        run: uv run python scripts/check_publication.py
      - name: Verify blank assessment notebooks
        run: uv run python scripts/validate_test_notebooks.py
      - name: Execute every lesson from a fresh kernel
        run: uv run python scripts/execute_lessons.py
      - name: Run Python tests
        run: uv run pytest
      - name: Run browser-logic unit tests
        run: npm test
      - name: Build Jupyter Book and JupyterLite
        run: uv run python scripts/build_site.py
      - name: Validate combined static artifact
        run: uv run python scripts/validate_site.py
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test accessibility, mobile layout, quizzes, certificate, and JupyterLite
        run: npm run test:e2e
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
